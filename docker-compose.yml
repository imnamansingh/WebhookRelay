name: webhook-relay

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.0
  environment: &kafka-environment
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: INTERNAL://:9093,EXTERNAL://:9092,CONTROLLER://:9094
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9094,2@kafka2:9094,3@kafka3:9094
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
    interval: 30s
    timeout: 5s
    retries: 10

services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 10

  kafka1:
    <<: *kafka-common
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9093,EXTERNAL://localhost:9092

  kafka2:
    <<: *kafka-common
    ports:
      - "127.0.0.1:9095:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://localhost:9095

  kafka3:
    <<: *kafka-common
    ports:
      - "127.0.0.1:9096:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9093,EXTERNAL://localhost:9096

  kafka-init:
    image: apache/kafka:3.7.0
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in webhooks webhooks-retry-10s webhooks-retry-60s; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka1:9093 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 3
        done
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  producer:
    image: webhook-relay-producer:latest
    build:
      context: ./producers
      dockerfile: DockerFile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      KAFKA_BROKER_URL: kafka1:9093,kafka2:9093,kafka3:9093
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 10

  consumer:
    image: webhook-relay-consumer:latest
    build:
      context: ./consumers
      dockerfile: DockerFile
    environment:
      MONGODB_CONNECTION_URL: mongodb://mongodb:27017
      KAFKA_BROKER_URL: kafka1:9093,kafka2:9093,kafka3:9093
      PRODUCER_URL: http://producer:3000/api/v1/producer/failed_webhook
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  test:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sh -c "node test.js --count=10 --interval=5000"
    environment:
      PRODUCER_URL: http://producer:3000/api/v1/producer/webhook
    depends_on:
      producer:
        condition: service_healthy
    volumes:
      - ./tests:/workspace



volumes:
  mongodb_data: